name: DING.AI Daily Newsletter

on:
  # Runs at 7:00 AM US Eastern (12:00 PM UTC)
  schedule:
    - cron: "0 12 * * *"

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      send_mode:
        description: "'draft' saves HTML only, 'send' emails all subscribers"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - send

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit history back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync subscribers from Google Sheet
        env:
          SIGNUP_SHEET_URL: ${{ secrets.SIGNUP_SHEET_URL }}
        run: python sync_subscribers.py

      - name: Run newsletter engine
        env:
          TZ: America/New_York
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # For scheduled runs, uses SEND_MODE secret.
          # For manual runs, uses the workflow_dispatch input.
          SEND_MODE: ${{ github.event.inputs.send_mode || secrets.SEND_MODE || 'draft' }}
        run: python newsletter.py

      - name: Commit updated history
        run: |
          git config user.name  "DING.AI Bot"
          git config user.email "bot@ding.ai"
          git add history/ subscribers.json
          git diff --staged --quiet || git commit -m "chore: newsletter history $(date -u '+%Y-%m-%d')"
          git push
