name: DING.AI Daily Newsletter

on:
  # Runs at 8:00 AM US PDT (15:00 UTC) / 8:00 AM PST = 16:00 UTC
  # Change to "0 16 * * *" in winter (PST, UTC-8)
  schedule:
    - cron: "0 15 * * *"

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      send_mode:
        description: "'draft' saves HTML only, 'send' emails all subscribers"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - send

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit history + archive back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync subscribers from Google Sheet
        env:
          SIGNUP_SHEET_URL: ${{ secrets.SIGNUP_SHEET_URL }}
          UNSUBSCRIBE_SHEET_URL: ${{ secrets.UNSUBSCRIBE_SHEET_URL }}
        run: python sync_subscribers.py

      - name: Run newsletter engine
        env:
          TZ: America/Los_Angeles
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OVERRIDES_SHEET_URL: ${{ secrets.OVERRIDES_SHEET_URL }}
          # For scheduled runs, uses SEND_MODE secret.
          # For manual runs, uses the workflow_dispatch input.
          SEND_MODE: ${{ github.event.inputs.send_mode || secrets.SEND_MODE || 'draft' }}
        run: python newsletter.py

      - name: Commit updated history + archive
        run: |
          git config user.name "DING.AI Bot"
          git config user.email "bot@ding.ai"
          git add history/ subscribers.json docs/
          git diff --staged --quiet || git commit -m "chore: newsletter $(date -u '+%Y-%m-%d')"
          git push

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Newsletter workflow failed — check the logs above.')
