<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DING.AI — Signal Over Noise</title>
  <meta name="description" content="Your daily AI-curated morning briefing. Signal over noise, every day." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0d1b2a;
      --blue:   #2d7dd2;
      --orange: #d4622a;
      --light:  #eef1f8;
      --mid:    #8899aa;
      --white:  #ffffff;
      --border: #dde3ee;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--light);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 3px solid var(--blue);
      padding: 36px 24px 32px;
      text-align: center;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--navy);
    }
    .logo span { color: var(--blue); }
    .tagline {
      margin-top: 6px;
      font-size: 0.92rem;
      color: var(--mid);
      font-style: italic;
      letter-spacing: 0.5px;
    }
    .subscribe-cta { margin-top: 22px; }
    .subscribe-cta a {
      display: inline-block;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 11px 32px;
      border-radius: 6px;
      transition: background 0.2s;
      letter-spacing: 0.3px;
    }
    .subscribe-cta a:hover { background: #1e5fa8; }
    .subscribe-note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--mid);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 24px;
      background: var(--navy);
      flex-wrap: wrap;
    }
    .stat-item { text-align: center; }
    .stat-number {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* ── Main layout ── */
    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 {
      font-size: 0.82rem;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .issue-count {
      font-size: 0.78rem;
      color: var(--mid);
    }

    /* ── Issue cards ── */
    .issue-list { list-style: none; }
    .issue-card {
      background: var(--white);
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
    }
    .issue-card:hover {
      box-shadow: 0 4px 18px rgba(45,125,210,0.13);
      border-color: var(--blue);
      transform: translateY(-1px);
    }
    .issue-date {
      min-width: 72px;
      text-align: center;
      flex-shrink: 0;
    }
    .issue-date .day {
      font-size: 2rem;
      font-weight: 800;
      color: var(--blue);
      line-height: 1;
    }
    .issue-date .month-year {
      font-size: 0.72rem;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    .issue-body { flex: 1; min-width: 0; }
    .issue-weekday {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .issue-subject {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .issue-arrow {
      color: var(--blue);
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    /* ── Latest badge on first card ── */
    .issue-card.is-latest .issue-weekday::after {
      content: " · LATEST";
      color: var(--orange);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 30px;
    }
    .page-btn {
      padding: 7px 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--navy);
      transition: border-color 0.15s, background 0.15s;
    }
    .page-btn:hover { border-color: var(--blue); background: #f4f7ff; }
    .page-btn.active { background: var(--blue); color: var(--white); border-color: var(--blue); }
    .page-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Empty state ── */
    .empty {
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 56px 24px;
      text-align: center;
      color: var(--mid);
    }
    .empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--navy); }
    .empty p  { font-size: 0.95rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 20px 40px;
      font-size: 0.82rem;
      color: var(--mid);
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }
    footer a { color: var(--blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <div class="logo">DING<span>.AI</span></div>
  <div class="tagline">Signal Over Noise — Your Daily Morning Briefing</div>
  <div class="subscribe-cta">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSf3b3Hb22XhCEC4BtLS7EiowMluBONH9RSV3F96JUghHl03Xw/viewform"
       target="_blank" rel="noopener">
      Subscribe — it&rsquo;s free
    </a>
  </div>
  <div class="subscribe-note">Delivered to your inbox every weekday morning</div>
</header>

<div class="stats-bar" id="stats-bar" style="display:none;">
  <div class="stat-item">
    <div class="stat-number" id="stat-issues">—</div>
    <div class="stat-label">Issues</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="stat-streak">—</div>
    <div class="stat-label">Day Streak</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="stat-latest">—</div>
    <div class="stat-label">Latest Issue</div>
  </div>
</div>

<main>
  <div class="section-header">
    <h2>Past Issues</h2>
    <span class="issue-count" id="issue-count"></span>
  </div>
  <ul class="issue-list" id="issue-list">
    <li class="empty">
      <div class="empty-icon">📬</div>
      <h3>Coming soon</h3>
      <p>Past issues will appear here automatically after each send.</p>
    </li>
  </ul>
  <div class="pagination" id="pagination" style="display:none;"></div>
</main>

<footer>
  <p>
    &copy; 2026 DING.AI &nbsp;&middot;&nbsp;
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSez5n0sl54Ja8Mm1PhywTOazz9G0pjiz5DoITy8bgNFZEe40w/viewform"
       target="_blank" rel="noopener">Unsubscribe</a>
  </p>
</footer>

<script>
  const PER_PAGE = 20;
  let allIssues = [];
  let currentPage = 0;

  function formatDate(dateStr) {
    const d       = new Date(dateStr + 'T12:00:00');
    const day     = d.getDate();
    const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
    const monthYr = d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    return { day, weekday, monthYr };
  }

  function renderPage(page) {
    const list  = document.getElementById('issue-list');
    const start = page * PER_PAGE;
    const slice = allIssues.slice(start, start + PER_PAGE);

    list.innerHTML = '';
    slice.forEach((issue, idx) => {
      const { day, weekday, monthYr } = formatDate(issue.date);
      const li       = document.createElement('li');
      const isLatest = (page === 0 && idx === 0);
      li.innerHTML = `
        <a class="issue-card${isLatest ? ' is-latest' : ''}" href="issues/${issue.date}.html">
          <div class="issue-date">
            <div class="day">${day}</div>
            <div class="month-year">${monthYr}</div>
          </div>
          <div class="issue-body">
            <div class="issue-weekday">${weekday}</div>
            <div class="issue-subject">${escHtml(issue.subject || 'DING.AI Daily Brief')}</div>
          </div>
          <div class="issue-arrow">&#8594;</div>
        </a>`;
      list.appendChild(li);
    });

    renderPagination();
  }

  function renderPagination() {
    const total   = Math.ceil(allIssues.length / PER_PAGE);
    const pagDiv  = document.getElementById('pagination');
    if (total <= 1) { pagDiv.style.display = 'none'; return; }
    pagDiv.style.display = 'flex';
    pagDiv.innerHTML = '';

    // Prev button
    const prev = document.createElement('button');
    prev.className = 'page-btn';
    prev.textContent = '← Newer';
    prev.disabled = currentPage === 0;
    prev.addEventListener('click', () => { currentPage--; renderPage(currentPage); window.scrollTo(0,0); });
    pagDiv.appendChild(prev);

    // Page numbers (show up to 5 around current)
    const radius = 2;
    for (let p = 0; p < total; p++) {
      if (p !== 0 && p !== total - 1 && Math.abs(p - currentPage) > radius) {
        if (p === currentPage - radius - 1 || p === currentPage + radius + 1) {
          const ellipsis = document.createElement('span');
          ellipsis.className = 'page-btn';
          ellipsis.textContent = '…';
          ellipsis.style.cursor = 'default';
          pagDiv.appendChild(ellipsis);
        }
        continue;
      }
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
      btn.textContent = p + 1;
      btn.addEventListener('click', () => { currentPage = p; renderPage(currentPage); window.scrollTo(0,0); });
      pagDiv.appendChild(btn);
    }

    // Next button
    const next = document.createElement('button');
    next.className = 'page-btn';
    next.textContent = 'Older →';
    next.disabled = currentPage === total - 1;
    next.addEventListener('click', () => { currentPage++; renderPage(currentPage); window.scrollTo(0,0); });
    pagDiv.appendChild(next);
  }

  function calcStreak(issues) {
    // Count consecutive daily issues ending at today/yesterday
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let streak = 0;
    let cursor = new Date(today);

    const dateSet = new Set(issues.map(i => i.date));
    while (true) {
      const key = cursor.toISOString().slice(0, 10);
      if (dateSet.has(key)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetch('issues/index.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(issues => {
      if (!issues || !issues.length) return;

      allIssues = issues.slice().sort((a, b) => b.date.localeCompare(a.date));

      // Update stats bar
      const statsBar = document.getElementById('stats-bar');
      statsBar.style.display = 'flex';
      document.getElementById('stat-issues').textContent  = allIssues.length;
      document.getElementById('stat-streak').textContent  = calcStreak(allIssues);

      const latest = new Date(allIssues[0].date + 'T12:00:00');
      document.getElementById('stat-latest').textContent  =
        latest.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      // Update count label
      document.getElementById('issue-count').textContent =
        `${allIssues.length} issue${allIssues.length === 1 ? '' : 's'}`;

      renderPage(0);
    })
    .catch(() => {
      // No index yet — keep the empty state
    });
</script>

</body>
</html>
