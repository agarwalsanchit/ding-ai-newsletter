<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribed · DING.AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0d1b2a;
      --blue:   #2d7dd2;
      --green:  #2ecc71;
      --light:  #eef1f8;
      --mid:    #8899aa;
      --white:  #ffffff;
      --border: #dde3ee;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--light);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--white);
      border-bottom: 3px solid var(--blue);
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      font-family: Georgia, serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--navy);
    }
    .logo span { color: var(--blue); }
    .tagline {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--mid);
      font-style: italic;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 20px;
      line-height: 1;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 14px;
    }

    .email-display {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 20px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message {
      font-size: 0.95rem;
      color: var(--mid);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .resubscribe-link a {
      color: var(--blue);
      font-size: 0.88rem;
      text-decoration: none;
    }
    .resubscribe-link a:hover { text-decoration: underline; }

    /* Status dot while submitting */
    .status {
      font-size: 0.75rem;
      color: var(--mid);
      margin-top: 24px;
      min-height: 18px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      color: var(--mid);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">DING<span>.AI</span></div>
  <div class="tagline">Signal Over Noise — Your Daily Morning Briefing</div>
</header>

<main>
  <div class="card">
    <div class="icon">✅</div>
    <h1>You've been unsubscribed</h1>
    <div class="email-display" id="email-display"></div>
    <p class="message">
      You've been successfully removed from the DING.AI newsletter.<br>
      You won't receive any more emails from us.
    </p>
    <div class="resubscribe-link">
      Changed your mind?
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSez5n0sl54Ja8Mm1PhywTOazz9G0pjiz5DoITy8bgNFZEe40w/viewform"
         target="_blank" rel="noopener">Re-subscribe here</a>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>

<footer>
  &copy; 2026 DING.AI &nbsp;&middot;&nbsp;
  <a href="index.html" style="color:var(--blue);text-decoration:none;">Past Issues</a>
</footer>

<script>
  const FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSez5n0sl54Ja8Mm1PhywTOazz9G0pjiz5DoITy8bgNFZEe40w/formResponse";
  const EMAIL_ENTRY = "entry.1983731698";

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  const email = decodeURIComponent(getParam("email"));

  // Show email if present
  const emailEl = document.getElementById("email-display");
  if (email) {
    emailEl.textContent = email;
  } else {
    emailEl.style.display = "none";
  }

  // Silently submit the unsubscribe to Google Forms so sync_subscribers.py
  // will pick it up and remove this address from subscribers.json
  if (email) {
    const body = new URLSearchParams();
    body.append(EMAIL_ENTRY, email);

    fetch(FORM_ACTION, {
      method: "POST",
      mode: "no-cors",          // Google Forms requires no-cors cross-origin
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    }).catch(() => {
      // Silent fail — the user sees the confirmation regardless
    });
  }
</script>

</body>
</html>
