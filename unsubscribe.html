<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribe from DING.AI Newsletter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 0.5rem; }
    .logo span { color: #ff4444; }
    .tagline { font-size: 0.85rem; color: #666; margin-bottom: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #aaa; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: #ff4444;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #cc2222; }
    .note { margin-top: 1.5rem; font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DING<span>.</span>AI</div>
    <div class="tagline">Your daily AI briefing</div>
    <h1>Unsubscribe</h1>
    <p>We're sorry to see you go. Click below to confirm your unsubscribe request — your email will be pre-filled in the form.</p>
    <a id="unsub-link" class="btn" href="#">Unsubscribe me</a>
    <p class="note">Your address will be removed before the next send.</p>
  </div>
  <script>
    const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSez5n0sl54Ja8Mm1PhywTOazz9G0pjiz5DoITy8bgNFZEe40w/viewform";
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email") || "";
    const link = document.getElementById("unsub-link");
    if (email) {
      link.href = FORM_BASE + "?usp=pp_url&entry.1983731698=" + encodeURIComponent(email);
    } else {
      link.href = FORM_BASE;
    }
  </script>
</body>
</html>
